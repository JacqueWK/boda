<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(to bottom, #fff8f0, #f3e5d8);
    overflow-x: hidden;
}

/* INTRO */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #fff8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    flex-direction: column;
}

.container {
    display: none;
    text-align: center;
    padding: 40px 20px;
}

/* TARJETA */
.box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 650px;
    margin: auto;
    box-shadow: 0px 20px 40px rgba(0,0,0,0.2);
    animation: fadeIn 2s ease;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    color: #c9a46c;
}

.names {
    font-size: 40px;
    color: #b76e79;
}

.details {
    font-size: 20px;
    margin: 15px 0;
}

button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: #c9a46c;
    color: white;
    cursor: pointer;
}

/* ANIMACIÓN */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1;}
}

/* PÉTALOS */
.petalo {
    position: fixed;
    top: -10px;
    width: 20px;
    height: 30px;
    background: #ffc0cb;
    border-radius: 50% 50% 50% 0;
    opacity: 0.9;
    animation: caer linear infinite;
}

@keyframes caer {
    to {
        transform: translateY(100vh);
    }
}

/* GALERÍA */
img {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>Victor y Jacqueline</h1>
    <button onclick="entrar()">Entrar a la invitación 💌</button>
</div>

<!-- CONTENIDO -->
<div class="container" id="contenido">
    <div class="box">

        <h1>¡Nos Casamos!</h1>

        <div class="names">
            Victor y Jacqueline
        </div>

        <p class="details">
            📅 15 de AGOSTO 2026<br>
            ⏰ 1:00 PM<br>
            📍 Puebla, México
        </p>

        <div id="countdown"></div>

        <br>
        <button onclick="abrirMapa()">📍 Ver ubicación</button>

        <h2>Nuestra historia 💕</h2>
        <img src="foto1.jpg">
        <img src="foto2.jpg">

    </div>
</div>

<!-- MÚSICA -->
<audio id="musica" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3">
</audio>

<script>
// ENTRAR
function entrar() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("contenido").style.display = "block";
    document.getElementById("musica").play();
}

// CONTADOR (CORREGIDO)
function actualizarContador() {

    const fechaEvento = new Date(2026, 7, 15, 13, 0, 0);
    const ahora = new Date();

    const diferencia = fechaEvento - ahora;

    if (diferencia <= 0) {
        document.getElementById("countdown").innerHTML = "¡Hoy es el gran día! 💍";
        return;
    }

    const dias = Math.ceil(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferencia / (1000 * 60)) % 60);

    document.getElementById("countdown").innerHTML =
        dias + " días " + horas + " hrs " + minutos + " min";
}

actualizarContador();
setInterval(actualizarContador, 1000);

// MAPA
function abrirMapa() {
    window.open("https://maps.google.com?q=Puebla");
}

// PÉTALOS GRANDES Y VARIADOS 🌸
setInterval(() => {
    let p = document.createElement("div");
    p.className = "petalo";

    p.style.left = Math.random() * 100 + "vw";

    let size = Math.random() * 20 + 20; // tamaño entre 20 y 40px
    p.style.width = size + "px";
    p.style.height = size + "px";

    p.style.animationDuration = (Math.random()*4+3) + "s";

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),7000);
}, 300);

</script>

</body>
</html>
