<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestra Boda</title>

<!-- Fuente elegante -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(135deg, #f8e1e7, #e6d3f3);
    text-align: center;
    color: #333;
}

/* ANIMACIÓN ENTRADA */
.fade {
    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

.container {
    padding: 40px 20px;
}

.box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 650px;
    margin: auto;
    box-shadow: 0px 15px 30px rgba(0,0,0,0.2);
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 55px;
    margin-bottom: 10px;
}

.names {
    font-size: 38px;
    color: #b76e79;
    margin: 20px 0;
}

.details {
    font-size: 20px;
    margin: 15px 0;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #b76e79;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #9c5a63;
}

#countdown {
    font-size: 25px;
    margin-top: 20px;
    color: #7a4c8c;
}

/* GALERÍA */
.gallery img {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
}

/* RSVP */
input {
    padding: 10px;
    margin: 5px;
    width: 80%;
    border-radius: 10px;
    border: 1px solid #ccc;
}

</style>
</head>

<body>

<div class="container fade">
    <div class="box">

        <h1>¡Nos Casamos!</h1>

        <div class="names">
            Jacqueline & [Tu pareja]
        </div>

        <p class="details">
            Con la bendición de nuestras familias
        </p>

        <p class="details">
            📅 20 de Diciembre 2026<br>
            ⏰ 5:00 PM<br>
            📍 Puebla, México
        </p>

        <!-- CUENTA REGRESIVA -->
        <div id="countdown"></div>

        <!-- BOTONES -->
        <br>
        <button onclick="abrirMapa()">📍 Ver ubicación</button>
        <button onclick="document.getElementById('musica').play()">🎵 Música</button>

        <!-- MÚSICA -->
        <audio id="musica" loop>
            <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
        </audio>

        <!-- GALERÍA -->
        <h2>Nuestra historia 💕</h2>
        <div class="gallery">
            <img src="https://picsum.photos/600/400?random=1">
            <img src="https://picsum.photos/600/400?random=2">
        </div>

        <!-- RSVP -->
        <h2>Confirmar asistencia</h2>
        <input type="text" placeholder="Tu nombre"><br>
        <button onclick="alert('Gracias por confirmar ❤️')">Confirmar</button>

    </div>
</div>

<script>
// CUENTA REGRESIVA
var fecha = new Date("Dec 20, 2026 17:00:00").getTime();

setInterval(function() {
    var ahora = new Date().getTime();
    var distancia = fecha - ahora;

    var dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
    var horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById("countdown").innerHTML =
        dias + " días " + horas + " hrs " + minutos + " min";
}, 1000);

// MAPA
function abrirMapa() {
    window.open("https://maps.google.com?q=Puebla");
}
</script>

</body>
</html>
