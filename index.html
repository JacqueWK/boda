<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Invitación de Boda</title>
    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8e1e7, #e6d3f3);
            color: #333;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 30px;
            margin-top: 0;
            color: #7a4c8c;
        }

        .names {
            font-size: 40px;
            margin: 30px 0;
            font-weight: bold;
        }

        .details {
            font-size: 20px;
            margin: 20px 0;
        }

        .box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 40px;
            font-size: 18px;
            color: #555;
        }

        .heart {
            color: #e91e63;
            font-size: 30px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 35px;
            }
            .names {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            <h1>¡Nos Casamos!</h1>
            <p class="heart">❤</p>

            <div class="names">
                Jacqueline & [Nombre de tu pareja]
            </div>

            <h2>Te invitamos a compartir este día tan especial</h2>

            <div class="details">
                📅 Fecha: 20 de Diciembre 2026<br><br>
                ⏰ Hora: 5:00 PM<br><br>
                📍 Lugar: Salón Jardín Los Encinos<br>
                Puebla, México
            </div>

            <div class="details">
                Será un honor contar con tu presencia
            </div>

            <div class="footer">
                Confirmar asistencia:<br>
                📞 222-123-4567
            </div>
        </div>
    </div>

</body>
</html>
